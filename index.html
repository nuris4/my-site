<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нурис | Python Developer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #4CAF50;
        }

        body.light-mode {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --accent-color: #2196F3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-btn {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .avatar {
            font-size: 80px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            color: var(--accent-color);
        }

        h2 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .links a {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: opacity 0.3s;
        }

        .links a:hover {
            opacity: 0.8;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-left: 5px solid var(--accent-color);
        }

        .project-card a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button class="theme-btn" onclick="toggleTheme()">🌗 Сменить тему</button>

    <div class="container">
        <div class="card">
            <div class="avatar">👨‍💻</div>
            <h1>Привет, я Нурис!</h1>
            <p>Начинающий Python-разработчик. Создаю Telegram-ботов и изучаю веб-разработку.</p>
            
            <div class="links">
                <a href="https://github.com/nurls4" target="_blank">Мой GitHub</a>
                <a href="https://t.me/" target="_blank">Telegram</a>
            </div>
        </div>

        <h2 style="text-align: center; width: 100%;">Мои проекты</h2>
        <div class="project-grid">
            <div class="project-card">
                <h3>🇹🇷 Kelimeler Bot</h3>
                <p>Telegram-бот для изучения турецких слов. Включает викторину, статистику и режим "наоборот".</p>
                <a href="https://github.com/nurls4/kelimeler-bot" target="_blank">Посмотреть код на GitHub →</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
